<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titulos</title>
</head>
<body>

<!--Para titulos se usa a tag <h1> até <h6>-->
   <h1>Titulo</h1>
   <h2>Subtitulo</h2>

<!--Para paragrafo se usa a tag <p>-->   
   <p>Paragrafo</p>

<!--Para citações se usa a tag <blockquote>-->
   <blockquote> Isto é uma citação.</blockquote>

<!--Para negrito se usa a tag <strong> e para sublinhado se usa a tag <u></u>-->
   <p><strong>Texto em negrito</strong></p>
   <p><strong><u>Texto em negrito sublinhado</u></strong></p>

<!--Para itálico se usa a tag <i>-->
   <p><i>Texto em itálico</i></p>

<!--Para marcações se usa a tag <mark>-->
   <p>Texto com <mark>marcação</mark></p>

<!--Para um testo na perte de cima da linha se usa a tag <sup> e para um texto na parte de baixo da linha se usa a tag <sub>-->
   <p>Texto com <sup>superior</sup> e <sub>inferior</sub></p>

<!--Para referencias em HTML acesse <a href="https://www.w3schools.com/html/html_formatting.asp">W3Schools</a-->

<!--para trasar uma linha horizontal se usa a tag <hr>-->
    <hr>


</body>
</html>
